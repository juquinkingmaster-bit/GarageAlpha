<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">

<title>GARAGE ALPHA – Gestion de garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F7;--card:#fff;--text:#0E1B3D;--muted:#5C6985;--line:#D9DFEC;--night:#0B1F4B;--blue:#1F6FEB;--soft:#E6EFFD;--ok:#157A4B;--warn:#B25E00;--bad:#B3261E;--ff:'Barlow',system-ui,sans-serif;--fh:'Barlow Semi Condensed','Barlow',sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1226;--card:#101B38;--text:#E8EDF9;--muted:#93A0C0;--line:#223157;--soft:#16264F;--ok:#4CC38A;--warn:#F2A451;--bad:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1226;--card:#101B38;--text:#E8EDF9;--muted:#93A0C0;--line:#223157;--soft:#16264F;--ok:#4CC38A;--warn:#F2A451;--bad:#FF8A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--ff);min-height:100vh}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--night);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh}
.logo{font:700 24px var(--fh);letter-spacing:.3px;margin:0 6px 4px}.logo b{color:#6FA8FF}
aside small{display:block;color:#9FB3E0;margin:0 6px 22px}
aside a{display:block;color:#C9D6F5;text-decoration:none;padding:9px 12px;border-radius:8px;margin-bottom:3px;font-weight:500}
aside a.on,aside a:hover{background:#1A3470;color:#fff}
main{padding:20px 24px 40px;min-width:0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.top h1{font:700 28px var(--fh);margin:0;flex:1 1 200px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.search{max-width:320px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.alt{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font:700 30px/1.1 var(--fh);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:500}
.chip.on{background:var(--night);color:#fff;border-color:var(--night)}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px;background:var(--soft)}
tr:last-child td{border-bottom:0}
.plate{font:700 16px var(--fh);letter-spacing:.5px}.muted{color:var(--muted);font-size:13px}
.rail{display:flex;gap:2px;margin:6px 0 4px}.rail i{flex:1;height:5px;border-radius:2px;background:var(--line)}.rail i.d{background:var(--blue)}.rail i.c{background:var(--warn)}
td select{padding:5px 8px}
.empty{padding:34px;text-align:center;color:var(--muted)}
.th{width:56px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
.pv{max-width:100%;max-height:170px;border-radius:8px;margin:8px 0 0;display:none}
.modal{position:fixed;inset:0;background:rgba(5,12,30,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:9}
.modal.open{display:flex}
.box{background:var(--card);border-radius:12px;width:min(720px,100%);padding:20px;border:1px solid var(--line)}
.box h2{font:700 22px var(--fh);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--muted)}label input,label select,label textarea{margin-top:3px;color:var(--text)}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:10px 12px}legend{font-weight:600;padding:0 6px}
.err{color:var(--bad);margin:8px 0;min-height:20px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--night);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:20}
.sheet h3{margin:12px 0 4px;font:700 17px var(--fh)}.sheet dl{display:grid;grid-template-columns:160px 1fr;gap:3px 10px;margin:0}.sheet dt{color:var(--muted)}.sheet dd{margin:0}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner button{margin-left:auto}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px;align-items:center}aside small{display:none}.logo{margin-right:auto}aside a{margin:0}main{padding:14px}}
@media print{aside,main>*:not(#printzone),.modal:not(.printing){display:none!important}.modal.printing{position:static;display:block;background:none;padding:0}.box{border:0;width:100%}.row{display:none}}
aside{display:flex;flex-direction:column}.who{margin-top:auto;padding:12px 6px 0;font-size:13px;color:#9FB3E0;border-top:1px solid #1A3470}.who b{color:#fff}
.sheet .hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;border-bottom:2px solid var(--night);padding-bottom:8px;margin-bottom:4px}.logo2{font:700 26px var(--fh)}.logo2 b{color:var(--blue)}
.sheet .sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:44px}.sheet .sig div{border-top:1px solid var(--muted);padding-top:4px;text-align:center;font-size:13px;color:var(--muted)}
@media (max-width:760px){aside{flex-direction:row}.who{margin:0;border:0;padding:0}}
@media print{@page{size:A4;margin:14mm}body,.box{background:#fff!important;color:#000!important}.sheet dt,.sheet .muted{color:#444!important}.sheet .hd{border-color:#000}.toast{display:none!important}body:not(.adm) .app,body:not(.adm) .modal{display:none!important}body:not(.adm)::before{content:"Impression réservée à l’administrateur.";display:block;padding:24px;font:700 18px sans-serif}}
.hero{position:relative;overflow:hidden;border-radius:16px;min-height:430px;background:linear-gradient(#0b1b44,#1b3a8a 62%,#2f6bff);color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.heroTxt{position:relative;z-index:2;text-align:center;padding:44px 20px 0}.heroTxt h2{font:700 36px var(--fh);margin:0 0 8px;letter-spacing:.04em}.heroTxt h2 span{color:#7fb0ff}.heroTxt p{margin:0 auto 18px;max-width:520px;color:#cdd9f7}
.lane{position:relative;overflow:hidden;height:104px;margin-top:auto}.track{display:flex;gap:70px;width:max-content;animation:drive 55s linear infinite}.track svg{width:220px;height:90px;flex:none;margin-top:8px;animation:bob .7s ease-in-out infinite alternate}.track svg:nth-child(even){animation-delay:.3s}
.road{height:26px;background:#0e1428;position:relative;overflow:hidden}.road::after{content:"";position:absolute;left:0;right:-80px;top:11px;height:4px;background:repeating-linear-gradient(90deg,#fff 0 40px,transparent 40px 80px);animation:dash 1.4s linear infinite}
.w{transform-box:fill-box;transform-origin:center;animation:spin .9s linear infinite}
@keyframes drive{from{transform:translateX(-50%)}to{transform:translateX(0)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dash{to{transform:translateX(-80px)}}@keyframes bob{to{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.track,.track svg,.w,.road::after{animation:none}}
.gal{position:relative;z-index:1;background:#0a1230}.gst{position:relative;height:270px;overflow:hidden;cursor:pointer;background:#0a1230}
.sl{position:absolute;inset:0;overflow:hidden;animation-duration:1.3s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,.8,.25,1)}
.sl .bg{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;filter:blur(18px) brightness(.55)}
.sl .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:kb 7s ease-out both}
.t-fade{animation-name:tFade}.t-zoom{animation-name:tZoom}.t-slideL{animation-name:tSlideL}.t-slideR{animation-name:tSlideR}.t-flip{animation-name:tFlip}.t-circle{animation-name:tCircle}.t-diag{animation-name:tDiag}.t-curtain{animation-name:tCurtain}.t-blur{animation-name:tBlur}.t-rotate{animation-name:tRotate}.t-drop{animation-name:tDrop}
@keyframes tFade{from{opacity:0}}@keyframes tZoom{from{opacity:0;transform:scale(1.6)}}@keyframes tSlideL{from{transform:translateX(100%)}}@keyframes tSlideR{from{transform:translateX(-100%)}}
@keyframes tFlip{from{transform:perspective(900px) rotateY(-90deg);opacity:.2}}@keyframes tCircle{from{clip-path:circle(0 at 50% 50%)}to{clip-path:circle(80% at 50% 50%)}}
@keyframes tDiag{from{clip-path:polygon(0 0,0 0,-40% 100%,-40% 100%)}to{clip-path:polygon(0 0,140% 0,100% 100%,-40% 100%)}}@keyframes tCurtain{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0)}}
@keyframes tBlur{from{opacity:0;filter:blur(24px)}}@keyframes tRotate{from{opacity:0;transform:rotate(-12deg) scale(.5)}}
@keyframes tDrop{0%{transform:translateY(-100%)}60%{transform:translateY(6%)}80%{transform:translateY(-2%)}100%{transform:none}}@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.gdots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;z-index:5}.gdots i{width:8px;height:8px;border-radius:6px;background:#ffffff66;cursor:pointer;transition:width .3s,background .3s}.gdots i.on{background:#fff;width:22px}
@media (prefers-reduced-motion:reduce){.sl{animation-duration:.01s}.sl .fg{animation:none}}
</style>
</head>

db.files.forEach(o=>{if(o.vid===x.id)Object.assign(o,{plate:x.plate,brand:x.brand,model:x.type})});
f.hist.push({s:f.status,at:now(),m:1,n:ch.join(", ")});save();render();toast(`Dossier ${f.no} modifié`);sheet(id)}}
function editV(id){if(!need())return;const x=db.vehicles.find(y=>y.id===id);openM(`<h2>${x?"Modifier le véhicule":"Ajouter un véhicule au parc"}</h2>${vehFields(x)}<div class="err" id="er"></div><div class="row"><button class="btn alt" onclick="closeM()">Annuler</button><button class="btn" id="ok">Enregistrer</button></div>`);
$("#ok").onclick=()=>{const r=readV(id||0);if(r.err)return $("#er").textContent=r.err;const y=saveV(r.v,id||0);db.files.forEach(f=>{if(f.vid===y.id)Object.assign(f,{plate:y.plate,brand:y.brand,model:y.type})});save();closeM();render();toast("Véhicule enregistré")}}
function sheet(id){const f=db.files.find(x=>x.id===id),c=cl(f.cid),v=vh(f),D=(l,x)=>`<dt>${l}</dt><dd>${esc(x||"—")}</dd>`;
openM(`<div class="sheet" id="printzone"><div class="hd"><div><div class="logo2">GARAGE <b>ALPHA</b></div><div class="muted">Kinshasa – Gestion de garage automobile</div></div><div style="text-align:right"><b>Fiche de réception</b><br><span class="plate">${esc(f.no)}</span><br><span class="muted">Entrée le ${fmt(f.entry)}</span></div></div>
<h3>Client</h3><dl>${D("Nom",c.name)}${D("Téléphone",c.phone)}${c.email?D("E-mail",c.email):""}</dl>
<h3>Véhicule</h3>${f.photo?`<img class="pv" style="display:block" src="${f.photo}" alt="Photo du véhicule">`:""}<dl>${D("Plaque",showP(v.plate))}${D("Marque",v.brand)}${D("Type",v.type)}${D("Genre",v.genre)}${D("Numéro de châssis",v.chassis)}${D("Année de fabrication",v.year)}${D("Mis en circulation",v.circ)}${D("Kilométrage à l’entrée",f.km?f.km.toLocaleString("fr-FR")+" km":"")}${D("Aspect extérieur",v.ext)}${D("Aspect intérieur",v.intr)}${D("État du moteur",v.motor)}${D("Valeur initiale",v.val?usd(v.val):"")}${D("Problème particulier",v.problem)}</dl>
<h3>Réception</h3><dl>${D("Motif",f.reason)}${D("Description",f.desc)}${D("Mécanicien",f.mech||"Non attribué")}${D("État actuel",L[f.status])}</dl>
<h3>Finances</h3><dl><dt>Total estimé</dt><dd>${usd(f.est)}</dd><dt>Avance versée</dt><dd>${usd(f.advance)}</dd><dt>Solde restant</dt><dd>${usd(f.est-f.advance)}</dd></dl>
<h3>Historique des états</h3><dl>${f.hist.map(h=>`<dt>${fmt(h.at)}</dt><dd>${esc(h.m?"Données modifiées":L[h.s])}${h.n?" – "+esc(h.n):""}</dd>`).join("")}</dl><div class="sig"><div>Signature du client</div><div>Cachet et signature du garage</div></div><div class="muted" style="margin-top:10px">Imprimé le ${fmt(now())}</div></div>
<div class="row" style="margin-top:14px"><button class="btn alt" onclick="closeM()">Fermer</button>${admin&&active(f)?`<button class="btn alt" onclick="editF(${f.id})">Modifier</button>`:""}${admin?`<button class="btn alt" onclick="mailM('f',${f.id})">Envoyer par e-mail</button><button class="btn" onclick="printNow()">Imprimer la fiche</button>`:""}</div>`)}
window.onafterprint=()=>$("#m").classList.remove("printing");
window.onhashchange=()=>{view=(location.hash||"#dash").slice(1);if(!["dash","parc","hist","clients"].includes(view))view="dash";render()};
document.querySelectorAll("aside a").forEach(a=>a.onclick=e=>{e.preventDefault();view=a.dataset.v;try{location.hash=view}catch(x){}render()});
load();if(!["dash","parc","hist","clients"].includes(view))view="dash";render();if(!admin)loginM();
</script>
